---
name: Release CLI

on:
  push:
    tags:
    - '*'
jobs:
  # upload-rust-binary-action does NOT create the release — it only uploads assets to an
  # existing one. Create it first, once, then fan out the per-target uploads.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/create-gh-release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-latest
        # MSVC, not gnu: cross-compiling the gnu toolchain's mingw target from Linux is
        # unreliable with `cross`, so this one builds natively on a windows runner instead.
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    steps:
    - uses: actions/checkout@v7
    # Builds kubectl-vynil for the target (uses `cross` for non-native arches on Linux;
    # windows-msvc builds natively on the windows-latest runner), then uploads the
    # archive to the release created above.
    - name: Build and upload kubectl-vynil
      uses: taiki-e/upload-rust-binary-action@v1
      with:
        bin: kubectl-vynil
        # Scope cargo to the CLI package: the workspace default-members are agent+operator,
        # so a bare `--bin kubectl-vynil` at the root resolves against the wrong package set.
        manifest-path: kubectl-vynil/Cargo.toml
        target: ${{ matrix.target }}
        archive: kubectl-vynil-$target
        tar: all
        token: ${{ secrets.GITHUB_TOKEN }}
